services:
  advisory-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      KNOWLEDGE_PATH: knowledge
      SMS_MAX_LENGTH: 160
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
