<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriSense SMS Receiver</title><style>body{font-family:system-ui;background:#eef3ed;margin:0;padding:20px}.wrap{max-width:520px;margin:auto}.msg{background:white;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 3px 14px #0001}.meta{font-size:12px;color:#647067}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #cbd4c8}button{background:#1f7a4c;color:white;border:0}</style></head><body><div class="wrap"><h1>AgriSense SMS Simulator</h1><p>Keep this page open on an Android phone connected to the same Wi‑Fi as the backend.</p><input id="r" placeholder="Recipient ID"><button onclick="start()">Connect</button><div id="state"></div><div id="msgs"></div></div><script>let timer;async function pull(){if(!r.value)return;try{let res=await fetch('/api/v1/sms/inbox/'+encodeURIComponent(r.value));if(res.status===401){state.textContent='Authentication is enabled. Use the management dashboard or a mobile app token for protected inbox access.';return}let d=await res.json();state.textContent='Connected • '+d.length+' message(s)';msgs.innerHTML=d.slice().reverse().map(x=>`<div class="msg"><div>${x.message}</div><div class="meta">${new Date(x.delivered_at).toLocaleString()} • ${x.crop_id}</div></div>`).join('')}catch(e){state.textContent='Cannot reach backend: '+e.message}}function start(){clearInterval(timer);pull();timer=setInterval(pull,2500)};</script></body></html>
